name: Sync New Papers

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:        # manual trigger from the GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research-dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r research-dashboard/requirements.txt

      - name: Run incremental sync
        id: sync
        working-directory: research-dashboard/scripts
        run: python sync_new_papers.py

      - name: Commit updated data files
        if: steps.sync.outputs.new_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research-dashboard/data/
          git commit -m "sync: add ${{ steps.sync.outputs.new_count }} new paper(s) [skip ci]"
          git push
